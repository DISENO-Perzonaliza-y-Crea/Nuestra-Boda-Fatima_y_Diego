                <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-xl p-3 w-full max-w-xs border border-stone-200 text-center">
                    <p class="text-[10px] uppercase tracking-widest text-amber-800 font-bold mb-2">Faltan para el gran día</p>
                    <div class="grid grid-cols-4 gap-1 text-center" id="countdown">
                        <div class="bg-stone-50 p-2 rounded-lg border border-stone-200">
                            <span id="days" class="block text-base font-bold text-stone-800">00</span>
                            <span class="text-[9px] uppercase text-stone-500">Días</span>

    <script>
        const audio = document.getElementById('wedding-audio');
        const playBtn = document.getElementById('play-music-btn');
        const quickAudioToggle = document.getElementById('quick-audio-toggle');
        const btnIcon = document.getElementById('btn-icon');
        
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                btnIcon.textContent = '▶';
                quickAudioToggle.innerHTML = '<span>🎵 Música</span>';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    btnIcon.textContent = '⏸';
                    quickAudioToggle.innerHTML = '<span>⏸ Pausar</span>';
                    isPlaying = true;
                }).catch(err => {
                    console.error("Error al reproducir audio:", err);
                });
            }
        }

        playBtn.addEventListener('click', togglePlay);
        quickAudioToggle.addEventListener('click', togglePlay);

        // Countdown Timer Logic (September 13, 2026 8:10 to November 14, 2026 16:00:00)
        const targetDate = new Date('November 14, 2026 16:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');

            if (distance < 0) {
                daysEl.textContent = '00';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minutesEl.textContent = String(minutes).padStart(2, '0');
            secondsEl.textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
